<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Kerry Chia — Obsidian Observatory</title>
  <desc id="description">A pale editorial nameplate with navy type, teal orbital paths and muted gold constellation nodes. All content remains visible without animation.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFA"/>
      <stop offset="1" stop-color="#EAF3F5"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#277A86" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#277A86" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#277A86" stroke-opacity="0.075"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)"/>
  <rect x="16.5" y="16.5" width="1167" height="367" rx="8" stroke="#277A86" stroke-opacity="0.22"/>
  <circle cx="954" cy="196" r="205" fill="url(#halo)"/>
  <path d="M52 73H1148M52 327H1148" stroke="#277A86" stroke-opacity="0.25"/>
  <path d="M52 73H134M52 327H134" stroke="#96723A" stroke-width="2"/>
  <g font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#27707B">
    <text x="52" y="52">KC / OBSIDIAN OBSERVATORY</text>
    <text x="1148" y="52" text-anchor="end">FIELDNOTES · 01</text>
  </g>
  <text x="48" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="108" letter-spacing="-4" fill="#10263A">Kerry Chia<tspan fill="#96723A">.</tspan></text>
  <text x="54" y="246" font-family="Arial, sans-serif" font-size="24" letter-spacing="0.5" fill="#47616D">Stay curious. Make things real.</text>
  <g font-family="'Courier New', monospace" font-size="13" letter-spacing="1.7" fill="#27707B">
    <text x="54" y="294">DATA / AI / BLOCKCHAIN</text>
    <text x="52" y="356">RENMIN UNIVERSITY OF CHINA</text>
    <text x="1148" y="356" text-anchor="end">CLASS OF 2029</text>
  </g>
  <g stroke="#277A86" stroke-opacity="0.45">
    <ellipse cx="954" cy="196" rx="178" ry="69" transform="rotate(-32 954 196)"/>
    <ellipse cx="954" cy="196" rx="178" ry="69" transform="rotate(32 954 196)"/>
    <circle cx="954" cy="196" r="112" stroke-opacity="0.22"/>
    <path d="M760 196H1148M954 86V306" stroke-dasharray="2 7" stroke-opacity="0.3"/>
    <path d="M852 127L1049 254L1060 131L850 255Z" stroke-opacity="0.22"/>
  </g>
  <circle cx="954" cy="196" r="30" stroke="#96723A" stroke-opacity="0.8"/>
  <circle cx="954" cy="196" r="5" fill="#96723A"/>
  <g fill="#277A86">
    <circle cx="852" cy="127" r="4"/>
    <circle cx="1060" cy="131" r="4"/>
    <circle cx="850" cy="255" r="4"/>
  </g>
  <circle cx="1049" cy="254" r="5" fill="#96723A"/>
  <g>
    <circle cx="954" cy="84" r="3" fill="#277A86"/>
    <animateTransform attributeName="transform" type="rotate" from="0 954 196" to="360 954 196" dur="90s" repeatCount="indefinite"/>
  </g>
  <path d="M1128 100V112M1122 106H1134M780 288V296M776 292H784" stroke="#96723A" stroke-opacity="0.65"/>
</svg>
