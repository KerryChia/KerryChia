<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Kerry Chia — Obsidian Observatory</title>
  <desc id="description">An editorial nameplate in deep navy, ice cyan and pale gold. Abstract orbital paths connect a constellation of nodes. All content remains visible without animation.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071526"/>
      <stop offset="1" stop-color="#10263A"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#5ABEC8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#5ABEC8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#A4EFF3" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)"/>
  <rect x="16.5" y="16.5" width="1167" height="367" rx="8" stroke="#A4EFF3" stroke-opacity="0.17"/>
  <circle cx="954" cy="196" r="205" fill="url(#halo)"/>
  <path d="M52 73H1148M52 327H1148" stroke="#A4EFF3" stroke-opacity="0.2"/>
  <path d="M52 73H134M52 327H134" stroke="#E6C586" stroke-width="2"/>
  <g font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#A4EFF3">
    <text x="52" y="52">KC / OBSIDIAN OBSERVATORY</text>
    <text x="1148" y="52" text-anchor="end">FIELDNOTES · 01</text>
  </g>
  <text x="48" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="108" letter-spacing="-4" fill="#F1F5F5">Kerry Chia<tspan fill="#E6C586">.</tspan></text>
  <text x="54" y="246" font-family="Arial, sans-serif" font-size="24" letter-spacing="0.5" fill="#C0D4DC">Stay curious. Make things real.</text>
  <g font-family="'Courier New', monospace" font-size="13" letter-spacing="1.7" fill="#A4EFF3">
    <text x="54" y="294">DATA / AI / BLOCKCHAIN</text>
    <text x="52" y="356">RENMIN UNIVERSITY OF CHINA</text>
    <text x="1148" y="356" text-anchor="end">CLASS OF 2029</text>
  </g>
  <g stroke="#A4EFF3" stroke-opacity="0.35">
    <ellipse cx="954" cy="196" rx="178" ry="69" transform="rotate(-32 954 196)"/>
    <ellipse cx="954" cy="196" rx="178" ry="69" transform="rotate(32 954 196)"/>
    <circle cx="954" cy="196" r="112" stroke-opacity="0.18"/>
    <path d="M760 196H1148M954 86V306" stroke-dasharray="2 7" stroke-opacity="0.2"/>
    <path d="M852 127L1049 254L1060 131L850 255Z" stroke-opacity="0.18"/>
  </g>
  <circle cx="954" cy="196" r="30" stroke="#E6C586" stroke-opacity="0.75"/>
  <circle cx="954" cy="196" r="5" fill="#E6C586"/>
  <g fill="#A4EFF3">
    <circle cx="852" cy="127" r="4"/>
    <circle cx="1060" cy="131" r="4"/>
    <circle cx="850" cy="255" r="4"/>
  </g>
  <circle cx="1049" cy="254" r="5" fill="#E6C586"/>
  <g>
    <circle cx="954" cy="84" r="3" fill="#A4EFF3"/>
    <animateTransform attributeName="transform" type="rotate" from="0 954 196" to="360 954 196" dur="90s" repeatCount="indefinite"/>
  </g>
  <path d="M1128 100V112M1122 106H1134M780 288V296M776 292H784" stroke="#E6C586" stroke-opacity="0.6"/>
</svg>
